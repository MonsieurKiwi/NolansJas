<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nolan's Ja's</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: simple, friendly, readable
   IDEA: a little sound board / soundpad
   PICTURE: the five push buttons themselves
   COLOUR and TYPE: beige ground, black ink, white buttons; DM Sans
   LAYOUT: one portrait screen: title, buttons centred, credit bottom right */
:root{color-scheme:light;--bg:#efe4cf;--ink:#111;--btn:#fff}
*{box-sizing:border-box;min-width:0;margin:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--ink);
  font:17px/1.4 "DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  min-height:100vh;min-height:100dvh;
  display:grid;grid-template-rows:auto 1fr auto;
  padding:max(env(safe-area-inset-top),clamp(16px,4dvh,40px)) 20px max(env(safe-area-inset-bottom),12px);
  overflow-x:clip;
}
header{text-align:center}
h1{
  font-weight:700;letter-spacing:-.01em;
  font-size:clamp(34px,min(11vw,7dvh),60px);line-height:1.02;
  display:inline-block;text-align:left;
}
h1 span{display:block}
h1 .indent{padding-left:1.1em}
main{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(10px,2dvh,18px);padding-block:clamp(16px,3dvh,32px);
}
button{
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
  width:min(100%,340px);
  height:clamp(48px,9dvh,72px);
  background:var(--btn);color:var(--ink);
  border:1.5px solid var(--ink);border-radius:14px;
  font:700 clamp(20px,3.2dvh,26px)/1 "DM Sans",system-ui,sans-serif;
  cursor:pointer;
  box-shadow:0 4px 0 var(--ink);
  transition:transform .06s ease,box-shadow .06s ease,background .2s;
}
button:active,button.on{transform:translateY(3px);box-shadow:0 1px 0 var(--ink);background:#f6f6f6}
button:focus-visible{outline:3px solid #111;outline-offset:4px}
footer{text-align:right;font-size:15px;font-weight:500}
@media (prefers-reduced-motion:reduce){button{transition:none}}
</style>
</head>
<body>
<header>
  <h1><span>Nolan's</span><span class="indent">Ja!'s</span></h1>
</header>

<main id="pad">
  <button type="button" data-i="0">Ja</button>
  <button type="button" data-i="1">Jaa</button>
  <button type="button" data-i="2">Jaaa</button>
  <button type="button" data-i="3">Jaaaa</button>
  <button type="button" data-i="4">Jaaaaah</button>
</main>

<footer>Ja! Let's Go</footer>

<script>
{
  // Sound files in the same folder as index.html.
  // Change these names to match your files exactly (capitals matter on most servers).
  const files = ['Ja.mp3', 'Jaa.mp3', 'Jaaa.mp3', 'Jaaaa.mp3', 'Jaaaaah.mp3'];

  // Load them once when the page opens
  const sounds = files.map(f => {
    const a = new Audio(f);
    a.preload = 'auto';
    return a;
  });

  const play = (i) => {
    const a = sounds[i];
    a.currentTime = 0;          // restart if it's already playing
    a.play().catch(() => {});   // ignore if the browser blocks it
  };

  document.getElementById('pad').addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    play(+b.dataset.i);
    b.classList.add('on');
    setTimeout(() => b.classList.remove('on'), 120);
  });
}
</script>
</body>
</html>
